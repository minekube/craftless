name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRAFTLESS_VERSION: 0.1.0-SNAPSHOT
  REGISTRY_IMAGE: ghcr.io/minekube/craftless

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Resolve release version
        if: github.ref_type == 'tag'
        run: echo "CRAFTLESS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify
        run: mise run ci

      - name: Package CLI
        run: |
          mise run package-cli
          mkdir -p build/release
          cp cli/build/distributions/craftless-*.zip build/release/
          cp cli/build/distributions/craftless-*.tar build/release/
          (cd build/release && shasum -a 256 * > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          files: |
            build/release/craftless-*.zip
            build/release/craftless-*.tar
            build/release/SHA256SUMS

  build-runtime-image:
    needs: release
    name: build runtime image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Resolve release version
        if: github.ref_type == 'tag'
        run: echo "CRAFTLESS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Package CLI
        run: mise run package-cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  publish-runtime-image-manifest:
    needs: build-runtime-image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:latest` is a live pointer. Re-running this workflow at an older tag -
      # to repair that release, or to hotfix an older line - would otherwise
      # drag `:latest` backwards and silently downgrade everyone pulling it.
      # Ask GitHub which release is newest rather than sorting tag names, which
      # would order v0.10.0 before v0.9.0.
      #
      # For a normal release this is always true, so the published tag set is
      # unchanged. When it is false the pointer is merely left where it is -
      # stale, never regressed, and visible on the next release.
      - name: Resolve whether this tag is the newest release
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NEWEST=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName,isLatest --jq '[.[] | select(.isLatest)] | first | .tagName // ""')
          echo "GitHub reports the newest release as: ${NEWEST:-<none>}"
          echo "This run publishes: $GITHUB_REF_NAME"

          if [ -n "$NEWEST" ] && [ "$NEWEST" = "$GITHUB_REF_NAME" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish runtime image manifest
        env:
          IS_NEWEST: ${{ steps.newest.outputs.is_newest }}
        run: |
          set -euo pipefail

          TAGS=(--tag "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}")
          if [ "$IS_NEWEST" = "true" ]; then
            TAGS+=(--tag "${REGISTRY_IMAGE}:latest")
          else
            echo "::notice::${GITHUB_REF_NAME} is not the newest release; leaving ${REGISTRY_IMAGE}:latest where it is."
          fi

          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}-arm64"
