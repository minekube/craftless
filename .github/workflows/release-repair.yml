name: release-repair

# Repairs the assets of an EXISTING published release, from that release's
# tagged source, on CI runners.
#
# Why this is a separate workflow on the default branch, and not an input on
# release.yml:
#
#   1. GitHub compiles a workflow_dispatch run from the workflow file AT THE
#      DISPATCHED REF. A "repair" input added to release.yml would simply not
#      exist when release.yml is dispatched at an old tag - the old file is the
#      one that runs. Dispatching THIS workflow (which lives on main) and
#      checking out the tag is the only shape that works for every tag,
#      including tags cut before this file existed.
#
#   2. release.yml moves the live `ghcr.io/minekube/craftless:latest` pointer.
#      Re-running it at an OLD tag would drag `:latest` backwards and silently
#      downgrade everyone pulling it. This workflow holds NO registry
#      credential and requests no registry scope, so a backward retag is not
#      "guarded against" here - it is unrepresentable. The safety is a
#      capability boundary, not an `if:` somebody can get wrong.
#
# This workflow publishes assets only. Moving the container image for a
# historical tag requires a separately authorized capability that is not built
# here. See docs/release-troubleshooting.md.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to repair (e.g. v0.3.5).
        required: true
        type: string

permissions:
  contents: write # GitHub Release asset upload. The ONLY permission.
  # Registry write access is deliberately absent and must stay absent. Without
  # it a backward `:latest` retag is not forbidden here, it is unrepresentable.
  # distribution.test.ts asserts this file grants no registry scope.

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      # Provenance: a repair must build the tag, not a branch that merely
      # happens to be named like one. A moving ref would produce assets that
      # do not correspond to the release they are attached to.
      - name: Confirm the checkout is the tagged commit
        run: |
          set -euo pipefail

          TAG_SHA=$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)
          HEAD_SHA=$(git rev-parse HEAD)

          if [ -z "$TAG_SHA" ]; then
            echo "::error::${RELEASE_TAG} is not a tag in this repository."
            echo "::error::Repair rebuilds tagged source; it does not build branches."
            exit 1
          fi
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Checked-out HEAD ($HEAD_SHA) is not tag ${RELEASE_TAG} ($TAG_SHA)."
            exit 1
          fi

          echo "Repairing ${RELEASE_TAG} from tagged commit ${TAG_SHA}."

      # GUARD 1, before the build rather than after it: repair fills holes. A
      # release that already carries a real build and its SHA256SUMS is
      # complete, and re-uploading over it would replace exactly the bytes
      # consumers have already checksummed. Failing here costs seconds instead
      # of a full `mise run ci`.
      - name: Refuse to repair a complete release
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No published release exists for $RELEASE_TAG to repair."
            echo "::error::Repair fills holes in an existing release; it does not create one."
            exit 1
          fi

          RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")

          EXISTING_BUILDS=$(printf '%s' "$RELEASE_JSON" | jq '
            [.assets[]
              | select(.state == "uploaded")
              | select(.size > 0)
              | select(.name | test("\\.(zip|tar)$"))] | length')
          HAS_SUMS=$(printf '%s' "$RELEASE_JSON" | jq '
            [.assets[] | select(.name == "SHA256SUMS" and .state == "uploaded" and .size > 0)] | length')

          echo "$RELEASE_TAG currently publishes:"
          printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | "  \(.name)\t\(.size)\t\(.state)"'

          if [ "$EXISTING_BUILDS" -gt 0 ] && [ "$HAS_SUMS" -gt 0 ]; then
            echo "::error::Release $RELEASE_TAG already has $EXISTING_BUILDS build archive(s) and SHA256SUMS."
            echo "::error::Refusing to modify a complete release. Repair fills holes only."
            exit 1
          fi

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Resolve release version
        run: echo "CRAFTLESS_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Same gate as release.yml. A repaired release must not carry weaker
      # provenance than one published on the normal path.
      - name: Verify
        run: mise run ci

      - name: Package CLI
        run: |
          mise run package-cli
          mkdir -p build/release
          cp cli/build/distributions/craftless-*.zip build/release/
          cp cli/build/distributions/craftless-*.tar build/release/
          (cd build/release && shasum -a 256 * > SHA256SUMS)
          ls -la build/release/

      # Repairing an existing release must not go through the `softprops`
      # gh-release action that release.yml uses for fresh publishes: it
      # PATCHes /releases/{id} to sync release metadata BEFORE uploading
      # anything, which both rewrites historical release notes and returns
      # "403 Resource not accessible by integration" on releases like these.
      # `gh release upload` only POSTs to /releases/{id}/assets.
      - name: Upload the missing assets
        run: |
          set -euo pipefail

          RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")

          # GUARD 2: never clobber an existing GOOD asset. Only names that are
          # absent, or present in a non-uploaded / zero-byte (failed upload)
          # state, are eligible; --clobber then applies solely to those holes.
          #
          # GUARD 3: for a name we are KEEPING, the published bytes must match
          # what we just built. Otherwise the SHA256SUMS we are about to upload
          # would describe bytes that were never published - a manifest that
          # resolves to a lie is worse than a missing one.
          UPLOAD_LIST=""
          SKIPPED=""
          for f in build/release/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            good=$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$base" \
              '[.assets[] | select(.name == $n and .state == "uploaded" and .size > 0)] | length')
            if [ "$good" -gt 0 ]; then
              asset_url=$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$base" \
                '[.assets[] | select(.name == $n and .state == "uploaded" and .size > 0)] | first | .url // empty')
              if [ -z "$asset_url" ]; then
                echo "::error::Could not resolve the published asset endpoint for $base."
                exit 1
              fi
              remote_tmp=$(mktemp)
              if ! gh api -H "Accept: application/octet-stream" "$asset_url" >"$remote_tmp"; then
                rm -f "$remote_tmp"
                echo "::error::Could not download the published asset $base for reconciliation."
                exit 1
              fi
              local_hash=$(sha256sum "$f" | awk '{print $1}')
              remote_hash=$(sha256sum "$remote_tmp" | awk '{print $1}')
              rm -f "$remote_tmp"
              if [ "$local_hash" != "$remote_hash" ]; then
                echo "::error::Asset $base differs from the local build of $RELEASE_TAG."
                echo "::error::$base local SHA-256:     $local_hash"
                echo "::error::$base published SHA-256: $remote_hash"
                echo "::error::Refusing to publish a SHA256SUMS that does not describe the published bytes."
                exit 1
              fi
              SKIPPED="$SKIPPED $base"
            else
              UPLOAD_LIST="$UPLOAD_LIST $f"
            fi
          done

          if [ -n "$SKIPPED" ]; then
            echo "Keeping existing good assets (not clobbered):$SKIPPED"
          fi

          if [ -z "$UPLOAD_LIST" ]; then
            echo "::error::Nothing to upload for $RELEASE_TAG: every built file is already published."
            exit 1
          fi

          echo "Uploading missing assets:$UPLOAD_LIST"
          # shellcheck disable=SC2086
          gh release upload "$RELEASE_TAG" $UPLOAD_LIST --clobber --repo "$GITHUB_REPOSITORY"

      # A release that publishes nothing downloadable is indistinguishable from
      # a healthy one: green run, release page exists, and the hole only
      # surfaces when a user's `install.sh` 404s. Trusting the upload step we
      # just ran would rebuild that same defect one layer up, so re-read the
      # PUBLISHED release from the API and assert on the landed fact.
      - name: Verify published release assets
        run: |
          set -euo pipefail

          # install.sh resolves exactly this name, so it is the asset that
          # decides whether the release is usable.
          REQUIRED_TAR="craftless-${RELEASE_TAG#v}.tar"
          SUMS_FILE=/tmp/published-sha256sums

          BUILD_FILTER='[.assets[]
            | select(.state == "uploaded")
            | select(.size > 0)
            | select(.name | test("\\.(zip|tar)$"))]'

          ASSET_COUNT=0
          BUILD_COUNT=0
          BUILD_NAMES=""
          SUMS_ID=""
          SUMS_READ=false
          MISSING=""
          MANIFEST_BUILDS=0
          TAR_PRESENT=0
          PROBE_CODE=""
          RELEASE_JSON=""

          PROBE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$REQUIRED_TAR"

          # Asset visibility is eventually consistent right after upload.
          for attempt in $(seq 1 12); do
            RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            ASSET_COUNT=$(printf '%s' "$RELEASE_JSON" | jq '[.assets[] | select(.state == "uploaded")] | length')
            BUILD_COUNT=$(printf '%s' "$RELEASE_JSON" | jq "$BUILD_FILTER | length")
            BUILD_NAMES=$(printf '%s' "$RELEASE_JSON" | jq -r "$BUILD_FILTER | .[].name")
            TAR_PRESENT=$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$REQUIRED_TAR" \
              '[.assets[] | select(.name == $n and .state == "uploaded" and .size > 0)] | length')
            SUMS_ID=$(printf '%s' "$RELEASE_JSON" \
              | jq -r '.assets[] | select(.name == "SHA256SUMS" and .state == "uploaded") | .id' \
              | head -n1)
            SUMS_READ=false
            MISSING=""
            MANIFEST_BUILDS=0
            PROBE_CODE=""
            : > "$SUMS_FILE"

            if [ -n "$SUMS_ID" ] && gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$SUMS_ID" \
              -H 'Accept: application/octet-stream' > "$SUMS_FILE"; then
              SUMS_READ=true

              # Every artifact SHA256SUMS promises must actually be published.
              # A manifest referencing a missing asset 404s just as hard as no
              # release at all, only later and less visibly.
              while read -r _ name; do
                [ -n "$name" ] || continue
                present=$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$name" \
                  '[.assets[] | select(.name == $n and .state == "uploaded")] | length')
                if [ "$present" -eq 0 ]; then
                  MISSING="$MISSING $name"
                elif echo "$BUILD_NAMES" | grep -Fxq "$name"; then
                  MANIFEST_BUILDS=$((MANIFEST_BUILDS + 1))
                fi
              done < "$SUMS_FILE"
            fi

            if [ "$TAR_PRESENT" -gt 0 ]; then
              # Prove the archive is SERVED, not merely listed by the API.
              if ! PROBE_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$PROBE_URL"); then
                PROBE_CODE="000"
              fi
            fi

            if [ "$BUILD_COUNT" -gt 0 ] && [ "$TAR_PRESENT" -gt 0 ] && [ "$SUMS_READ" = true ] \
              && [ -z "$MISSING" ] && [ "$MANIFEST_BUILDS" -gt 0 ]; then
              case "$PROBE_CODE" in
                200 | 206) break ;;
              esac
            fi

            echo "Published assets are incomplete on $RELEASE_TAG (attempt $attempt); waiting..."
            sleep 10
          done

          printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | "\(.name)\t\(.size)\t\(.state)"'
          if [ "$SUMS_READ" = true ]; then
            cat "$SUMS_FILE"
          else
            echo "SHA256SUMS contents unavailable."
          fi

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG publishes ZERO downloadable assets."
            echo "::error::A release with no artifact silently did not happen. Failing loudly."
            exit 1
          fi

          # A positive asset count is not a release. A release carrying only
          # SHA256SUMS looks populated and offers nothing anyone can run.
          if [ "$BUILD_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG has $ASSET_COUNT asset(s) but NO CLI archive."
            echo "::error::Only checksums/metadata were published - nothing runnable."
            exit 1
          fi

          if [ "$TAR_PRESENT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG does not publish $REQUIRED_TAR."
            echo "::error::install.sh resolves that exact name and will 404 without it."
            exit 1
          fi

          if [ -z "$SUMS_ID" ] || [ "$SUMS_READ" != true ]; then
            echo "::error::SHA256SUMS on $RELEASE_TAG is missing or undownloadable; the manifest is unresolvable."
            exit 1
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::SHA256SUMS on $RELEASE_TAG references assets that are not published:$MISSING"
            exit 1
          fi

          if [ "$MANIFEST_BUILDS" -eq 0 ]; then
            echo "::error::SHA256SUMS on $RELEASE_TAG references no CLI archive; the manifest is unresolvable."
            exit 1
          fi

          if [ "$PROBE_CODE" != "200" ] && [ "$PROBE_CODE" != "206" ]; then
            echo "::error::$REQUIRED_TAR is listed on $RELEASE_TAG but not downloadable (HTTP $PROBE_CODE)."
            echo "::error::$PROBE_URL"
            exit 1
          fi

          echo "OK: $RELEASE_TAG publishes $BUILD_COUNT CLI archive(s) of $ASSET_COUNT assets;"
          echo "OK: SHA256SUMS resolves to all of them and $REQUIRED_TAR downloads (HTTP $PROBE_CODE)."
          echo "NOTE: the container image was NOT touched. This workflow holds no registry"
          echo "NOTE: credential. Moving it requires a separately authorized, credential-holding capability"
          echo "NOTE: that this workflow cannot perform; see docs/release-troubleshooting.md."
